name: Check and build APK

on:
  push:
    branches: [main, "feature/**", "fix/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      variant:
        description: "debug 测试包 / release 固定签名正式包（需先配置 Secrets）"
        type: choice
        options: [debug, release]
        default: debug

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Source and browser checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VITE_HOLIDAY_FEED_URL: ${{ vars.HOLIDAY_FEED_URL }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run policy:validate
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: browser-test-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  android:
    name: Android APK
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      BUILD_VARIANT: ${{ github.event_name == 'workflow_dispatch' && inputs.variant || 'debug' }}
      VERSION_CODE: ${{ github.run_number }}
      VITE_HOLIDAY_FEED_URL: ${{ vars.HOLIDAY_FEED_URL }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21"
      - name: Set up Android SDK tools
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
        with:
          cmdline-tools-version: "15859902"
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false
      - name: Install Android SDK packages
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - run: npm ci
      - run: npm run android:sync
      - name: Prepare release signing
        if: env.BUILD_VARIANT == 'release'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: node scripts/ci-signing.mjs
      - name: Compile APK
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ "$BUILD_VARIANT" = 'release' ]; then
            bash ./gradlew assembleRelease --no-daemon
          else
            bash ./gradlew assembleDebug --no-daemon
          fi
      - name: Upload installable APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: chaoxi-${{ env.BUILD_VARIANT }}-${{ github.run_number }}
          path: android/app/build/outputs/apk/${{ env.BUILD_VARIANT }}/app-${{ env.BUILD_VARIANT }}.apk
          if-no-files-found: error
          retention-days: 7
